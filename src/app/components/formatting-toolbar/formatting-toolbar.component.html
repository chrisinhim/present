<div
  class="relative z-30 bg-white border border-slate-200 rounded-xl shadow-xs p-1 sm:p-1.5 flex items-center justify-between gap-1 text-slate-700"
>
  <!-- LEFT: 2 ROWS OF FORMATTING TOOLS -->
  <div class="flex-1 flex flex-col gap-1 min-w-0">
    <!-- ROW 1: FONT, STYLES, SPACING, COLORS, LINE SPACING -->
    <div class="relative z-20 flex items-center gap-0.5 flex-nowrap">
      <!-- Font Family -->
      <app-font-family-button (openFontModal)="showFontModal.set(true)" />

      <!-- Font Size & Steppers (includes A▲ and A▼) -->
      <app-font-size-button />

      <!-- Reset / Clear Formatting (A with red slash) -->
      <app-reset-formatting-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Font Styles: B, I, U, S -->
      <app-font-style-buttons />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Letter Spacing (A↔V) -->
      <app-letter-spacing-button />

      <!-- Text Case (Aa) -->
      <app-text-case-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Highlight Color (ab) & Font Color (A) -->
      <app-highlight-button (openModal)="showHighlightModal.set(true)" />
      <app-color-picker-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Line Spacing (LS 58) -->
      <app-line-spacing-button />
    </div>

    <!-- ROW 2: ROTATE, TEXT FILL, OUTLINE, EFFECTS, BACKGROUND, ANIMATIONS -->
    <div class="relative z-10 flex items-center gap-0.5 pt-1 border-t border-slate-100 flex-nowrap">
      <!-- Rotate -->
      <app-rotate-buttons />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Text Fill -->
      <app-text-fill-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Text Outline -->
      <app-outline-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Text Effects (Shadow & Glow) -->
      <app-text-effects-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Background -->
      <app-background-button (openModal)="showBgModal.set(true)" />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Entry Animation -->
      <app-entry-animation-button />

      <div class="h-3.5 w-px bg-slate-200 shrink-0"></div>

      <!-- Exit Animation -->
      <app-exit-animation-button />
    </div>
  </div>

  <div class="h-10 w-px bg-slate-200 shrink-0"></div>

  <!-- RIGHT: QUICK ALIGN (3x3) & ALIGNMENT ADJUSTMENTS (V & H) -->
  <div class="flex items-center gap-1 shrink-0">
    <!-- Quick Align (3x3 Grid) -->
    <app-quick-align-button />

    <!-- Vertical & Horizontal Adjustments (Stacked V & H) -->
    <div class="flex flex-col gap-0.5 justify-center">
      <app-v-align-adjustment-button />
      <app-h-align-adjustment-button />
    </div>
  </div>
</div>


<!-- FLOATING MODALS -->
@if (showFontModal()) {
  <app-font-modal (close)="showFontModal.set(false)" />
}

@if (showHighlightModal()) {
  <app-highlight-modal (close)="showHighlightModal.set(false)" />
}

@if (showBgModal()) {
  <app-background-modal (close)="showBgModal.set(false)" />
}
